<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Polygons — 100 games embedded in one tab. Slope, FNAF, Minecraft Classic, and more on the same site."
    />
    <meta name="theme-color" content="#0b1020" />
    <title>Polygons — play in one tab</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <script>
      (function () {
        var ua = navigator.userAgent;
        var lite =
          /CrOS/i.test(ua) ||
          (navigator.deviceMemory && navigator.deviceMemory <= 4) ||
          (navigator.hardwareConcurrency <= 4 &&
            window.matchMedia &&
            window.matchMedia("(pointer: coarse)").matches);
        if (lite) {
          document.documentElement.dataset.perf = "lite";
          document.documentElement.classList.add("perf-lite");
        }
      })();
    </script>
    <link
      id="gf-fonts"
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Public+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap"
    />
    <style>
      html,
      body {
        margin: 0;
        background: #0b1020;
        color: #f4f7fb;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
